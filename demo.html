@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#0F2328; --ink-soft:#3E555C; --mist:#8AA0A6;
  --paper:#F4F7F7; --card:#FFFFFF; --line:#E1E9E9;
  --teal:#0E6E6B; --teal-deep:#0A4F4D; --teal-tint:#E3F0EF;
  --ok:#2E7D5B; --ok-tint:#E4F2EB;
  --warn:#B07A1F; --warn-tint:#FBF1DC;
  --bad:#B3423A; --bad-tint:#F9E7E5;
  --dl:#1272C4; --dl-tint:#E6F0FA;
  --stripe:#635BFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
.honoris{font-family:'Manrope',sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;display:flex;justify-content:center;}
.shell{width:100%;max-width:440px;display:flex;flex-direction:column;min-height:100vh;background:var(--paper);}
.mono{font-family:'IBM Plex Mono',monospace;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';}

/* login */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px;background:var(--teal-deep);}
.login .brandbig{color:#fff;text-align:center;margin-bottom:26px;}
.login .brandbig h1{font-size:26px;font-weight:800;letter-spacing:.06em;}
.login .brandbig p{font-size:12.5px;color:#9FC5C3;margin-top:6px;font-weight:600;}
.login-card{background:var(--card);border-radius:16px;padding:20px;}
.login-card h2{font-size:15px;font-weight:800;margin-bottom:14px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;
  font-family:'Manrope';font-size:13.5px;background:var(--card);color:var(--ink);font-weight:600;}
.field input:focus,.field select:focus{outline:2px solid var(--teal);border-color:var(--teal);}
.login-err{background:var(--bad-tint);color:var(--bad);font-size:12px;font-weight:700;
  border-radius:8px;padding:9px 11px;margin-bottom:10px;}
.demo-creds{margin-top:14px;background:#0D5D5A;border-radius:12px;padding:13px;}
.demo-creds .t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9FC5C3;font-weight:800;margin-bottom:7px;}
.demo-creds div.c{display:flex;justify-content:space-between;font-size:12px;color:#DCEBEA;padding:3px 0;font-weight:600;}
.demo-creds .mono{color:#fff;}

/* top bar */
.topbar{background:var(--teal-deep);color:#fff;padding:14px 18px 12px;position:sticky;top:0;z-index:20;}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.04em;}
.brand span{font-size:11px;color:#9FC5C3;font-weight:500;}
.whoami{margin-top:9px;display:flex;justify-content:space-between;align-items:center;}
.whoami .n{font-size:13px;font-weight:800;}
.whoami .s{font-size:11px;color:#9FC5C3;font-weight:600;}
.logout{background:none;border:1.5px solid #2A7370;color:#C9DEDD;font-size:11.5px;font-weight:800;
  border-radius:8px;padding:5px 11px;cursor:pointer;font-family:'Manrope';}
.surg-select{margin-top:10px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid #1C6360;
  background:#0D5D5A;color:#fff;font-family:'Manrope';font-size:13px;font-weight:600;}

/* tabs */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:11px;font-weight:700;color:var(--mist);
  border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:'Manrope';}
.tab.on{color:var(--teal);border-bottom-color:var(--teal);}

.body{flex:1;padding:16px 16px 90px;}
.h2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 10px;}
.h2:first-child{margin-top:2px;}

/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;}
.kpi .v{font-size:17px;font-weight:800;}
.kpi .l{font-size:10.5px;color:var(--mist);font-weight:600;margin-top:3px;line-height:1.25;}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.card.click{cursor:pointer;transition:border-color .15s;}
.card.click:hover{border-color:var(--teal);}
.card.alert{border-color:#EACBC8;background:#FDF7F6;}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pname{font-size:14.5px;font-weight:800;}
.psub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.pref{font-size:10.5px;color:var(--mist);margin-top:4px;}
.amt{font-size:15px;font-weight:800;white-space:nowrap;}

/* badges */
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.b-ok{background:var(--ok-tint);color:var(--ok);}
.b-warn{background:var(--warn-tint);color:var(--warn);}
.b-bad{background:var(--bad-tint);color:var(--bad);}
.b-teal{background:var(--teal-tint);color:var(--teal);}
.b-mist{background:#EEF2F2;color:var(--ink-soft);}
.b-dl{background:var(--dl-tint);color:var(--dl);}
.b-stripe{background:#EEEDFF;color:var(--stripe);}
.b-violet{background:#ECEAF8;color:#5B4FB0;}

/* payment rail */
.rail{display:flex;align-items:center;margin-top:12px;}
.rail .seg{flex:1;height:3px;background:var(--line);}
.rail .seg.done{background:var(--ok);}
.rail .seg.late{background:var(--bad);}
.dotw{display:flex;flex-direction:column;align-items:center;width:0;overflow:visible;}
.dot{width:13px;height:13px;border-radius:50%;border:3px solid var(--line);background:var(--card);flex-shrink:0;}
.dot.done{border-color:var(--ok);background:var(--ok);}
.dot.late{border-color:var(--bad);background:var(--bad);}
.dot.next{border-color:var(--teal);}
.rail-labels{display:flex;justify-content:space-between;margin-top:6px;}
.rail-labels div{font-size:9.5px;color:var(--mist);font-weight:700;text-align:center;line-height:1.3;}
.rail-labels div b{display:block;color:var(--ink-soft);}

/* buttons */
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;font-family:'Manrope';
  font-size:13.5px;font-weight:800;cursor:pointer;margin-top:8px;}
.btn-p{background:var(--teal);color:#fff;}
.btn-p:hover{background:var(--teal-deep);}
.btn-s{background:var(--card);color:var(--teal);border:1.5px solid var(--teal);}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-bad{background:var(--bad);color:#fff;}
.btn-dl{background:var(--dl);color:#fff;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{margin-top:8px;}
.btn:disabled{cursor:default;}

/* detail */
.back{background:none;border:none;color:var(--teal);font-weight:800;font-size:13px;cursor:pointer;
  font-family:'Manrope';padding:0;margin-bottom:12px;}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--mist);font-weight:600;}
.kv .v{font-weight:700;text-align:right;}
.hist{font-size:12px;color:var(--ink-soft);padding:6px 0;border-bottom:1px dashed var(--line);line-height:1.4;}
.hist:last-child{border-bottom:none;}

/* documents (devis / facture) */
.doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:10px;}
.doc-head{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px;}
.doc-head .who{font-size:13px;font-weight:800;line-height:1.45;}
.doc-head .who small{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;}
.doc-type{text-align:right;}
.doc-type .t{font-size:15px;font-weight:800;letter-spacing:.05em;}
.doc-type .n{font-size:11px;color:var(--mist);font-weight:700;margin-top:3px;}
.doc-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--line);}
.doc-line .k{color:var(--ink-soft);font-weight:600;}
.doc-line .v{font-weight:700;text-align:right;}
.doc-total{display:flex;justify-content:space-between;padding:11px 12px;background:var(--teal-tint);

.doc-mentions{font-size:10.5px;color:var(--mist);font-weight:600;line-height:1.55;margin-top:12px;}
.doc-paid{margin-top:12px;border:2px solid var(--ok);color:var(--ok);border-radius:10px;padding:9px;

/* acte summary in form */
.acte-sum{background:var(--teal-tint);border-radius:10px;padding:11px 12px;font-size:12px;
  color:var(--teal-deep);font-weight:600;line-height:1.6;margin-bottom:11px;}

/* notifications */
.notif{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-bottom:8px;}
.chan{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;}
.chan.wa{background:#E4F6EC;}
.chan.mail{background:var(--teal-tint);}
.chan.dl{background:var(--dl-tint);}
.notif .t{font-size:12.5px;line-height:1.45;}
.notif .m{font-size:10.5px;color:var(--mist);margin-top:3px;font-weight:600;}

/* patient view */
.pv-head{background:var(--teal-deep);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;}
.pv-head .cab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9FC5C3;font-weight:700;}
.pv-head h2{font-size:19px;font-weight:800;margin-top:6px;}
.pv-head p{font-size:12.5px;color:#C9DEDD;margin-top:4px;}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px;cursor:pointer;
  background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.opt.sel{border-color:var(--teal);background:var(--teal-tint);}
.opt .ot{font-size:13.5px;font-weight:800;}
.opt .od{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.cardform{margin-top:12px;}
.cardform input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;
  font-family:'IBM Plex Mono';font-size:13px;margin-bottom:8px;background:var(--card);color:var(--ink);}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink-soft);
  background:var(--warn-tint);border-radius:10px;padding:11px;margin:10px 0;line-height:1.45;}
.stripe-note{text-align:center;font-size:10.5px;color:var(--mist);margin-top:10px;font-weight:600;}
.success{text-align:center;padding:34px 16px;}
.success .ic{width:58px;height:58px;border-radius:50%;background:var(--ok-tint);color:var(--ok);
  display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;}
.demo-tag{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:10.5px;font-weight:800;padding:6px 14px;border-radius:99px;z-index:30;opacity:.88;}
.empty{color:var(--mist);font-size:13px;text-align:center;padding:24px 0;font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.planbox{background:var(--teal-tint);border-radius:12px;padding:12px 13px;font-size:12px;
  color:var(--teal-deep);line-height:1.55;font-weight:600;}
.note{font-size:10.5px;color:var(--mist);font-weight:600;line-height:1.5;margin-top:8px;}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px;}
.progress i{display:block;height:100%;border-radius:99px;transition:width .3s;}

/* ---- Adaptation desktop ---- */
@media (min-width: 768px){
  .shell{max-width:860px;}
  .body{padding-left:28px;padding-right:28px;}
  .tab{font-size:13px;padding:13px 6px;}
  .brand h1{font-size:18px;}
}
@media (min-width: 1050px){
  .shell{max-width:1120px;}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start;}
  .dgrid > *{grid-column:1 / -1;}
  .dgrid > .card{grid-column:auto;}
  .dgrid > .card.full{grid-column:1 / -1;}
}

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --ink:#0F2328; --ink-soft:#3E555C; --mist:#8AA0A6;
  --paper:#F4F7F7; --card:#FFFFFF; --line:#E1E9E9;
  --teal:#0E6E6B; --teal-deep:#0A4F4D; --teal-tint:#E3F0EF;
  --ok:#2E7D5B; --ok-tint:#E4F2EB;
  --warn:#B07A1F; --warn-tint:#FBF1DC;
  --bad:#B3423A; --bad-tint:#F9E7E5;
  --violet:#5B4FB0; --violet-tint:#ECEAF8;
}
*{box-sizing:border-box;margin:0;padding:0;}
.app{font-family:'Manrope',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;justify-content:center;}
.shell{width:100%;max-width:440px;display:flex;flex-direction:column;min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}
.topbar{background:var(--teal-deep);color:#fff;padding:14px 18px 12px;position:sticky;top:0;z-index:20;}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.04em;}
.brand span{font-size:10.5px;color:#9FC5C3;font-weight:600;}
.surg-select{margin-top:10px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid #1C6360;background:#0D5D5A;color:#fff;font-family:'Manrope';font-size:13px;font-weight:600;}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--mist);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:'Manrope';}
.tab.on{color:var(--teal);border-bottom-color:var(--teal);}
.body{flex:1;padding:16px 16px 90px;}
.h2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 10px;}
.h2:first-child{margin-top:2px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.card.click{cursor:pointer;}
.card.click:hover{border-color:var(--teal);}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pname{font-size:14.5px;font-weight:800;}
.psub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.pref{font-size:10.5px;color:var(--mist);margin-top:4px;}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.b-ok{background:var(--ok-tint);color:var(--ok);}
.b-warn{background:var(--warn-tint);color:var(--warn);}
.b-teal{background:var(--teal-tint);color:var(--teal);}
.b-mist{background:#EEF2F2;color:var(--ink-soft);}
.b-violet{background:var(--violet-tint);color:var(--violet);}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;font-family:'Manrope';font-size:13.5px;font-weight:800;cursor:pointer;margin-top:8px;}
.btn-p{background:var(--teal);color:#fff;}
.btn-s{background:var(--card);color:var(--teal);border:1.5px solid var(--teal);}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-v{background:var(--violet);color:#fff;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{margin-top:8px;}
.btn:disabled{cursor:default;opacity:.5;}
.back{background:none;border:none;color:var(--teal);font-weight:800;font-size:13px;cursor:pointer;font-family:'Manrope';padding:0;margin-bottom:12px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;font-family:'Manrope';font-size:13.5px;background:var(--card);color:var(--ink);font-weight:600;}
.field textarea{min-height:80px;resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.note{font-size:10.5px;color:var(--mist);font-weight:600;line-height:1.5;margin-top:8px;}
.docline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
.docline:last-child{border-bottom:none;}
.docline .n{font-size:13px;font-weight:700;}
.docline .m{font-size:10.5px;color:var(--mist);font-weight:600;margin-top:2px;}
.del{background:none;border:none;color:var(--bad);font-size:15px;cursor:pointer;padding:4px;}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px;}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s;}
.paperdoc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:10px;}
.paperhead{border-bottom:2px solid var(--teal-deep);padding-bottom:10px;margin-bottom:12px;font-size:12.5px;font-weight:800;line-height:1.5;}
.paperhead small{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600;}
.paperbody{font-size:12.5px;line-height:1.65;color:var(--ink);white-space:pre-line;}
.signbox{border:1.5px dashed var(--teal);border-radius:10px;padding:12px;margin-top:12px;}
.signbox input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono';font-size:13px;margin-top:8px;}
.stamp{margin-top:10px;border:2px solid var(--ok);color:var(--ok);border-radius:10px;padding:8px;text-align:center;font-weight:800;font-size:12px;transform:rotate(-1.5deg);}
.logline{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12px;line-height:1.45;}
.logline .h{font-size:10.5px;color:var(--mist);font-weight:700;margin-top:2px;}
.demo-tag{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;padding:6px 14px;border-radius:99px;z-index:30;opacity:.88;}
.empty{color:var(--mist);font-size:13px;text-align:center;padding:22px 0;font-weight:600;}

/* ---- Adaptation desktop ---- */
@media (min-width: 768px){
  .shell{max-width:860px;}
  .body{padding-left:28px;padding-right:28px;}
  .tab{font-size:13px;padding:13px 6px;}
  .brand h1{font-size:18px;}
}
@media (min-width: 1050px){
  .shell{max-width:1120px;}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start;}
  .dgrid > *{grid-column:1 / -1;}
  .dgrid > .card{grid-column:auto;}
  .dgrid > .card.full{grid-column:1 / -1;}
}
