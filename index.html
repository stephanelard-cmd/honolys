<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honolys</title>
  <meta name="description" content="Site officiel Honolys.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://honolys.fr/">
  <meta property="og:title" content="Honolys">
  <meta property="og:description" content="Site officiel Honolys.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://honolys.fr/">
  <style>
    :root { color-scheme: light; --bg:#f6f2ea; --ink:#17212b; --muted:#5d6670; --accent:#97724b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top left, #fff 0, var(--bg) 38%, #e9dfcf 100%); color:var(--ink); }
    main { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
    .card { width:min(860px, 100%); padding:56px; border:1px solid rgba(23,33,43,.12); border-radius:28px; background:rgba(255,255,255,.62); box-shadow:0 24px 70px rgba(23,33,43,.12); backdrop-filter: blur(10px); }
    .eyebrow { margin:0 0 18px; color:var(--accent); font-size:14px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; }
    h1 { margin:0; font-size:clamp(48px, 9vw, 96px); line-height:.92; letter-spacing:-.07em; }
    p { max-width:620px; margin:28px 0 0; font-size:clamp(18px, 2.2vw, 24px); line-height:1.45; color:var(--muted); }
    .footer { margin-top:56px; padding-top:24px; border-top:1px solid rgba(23,33,43,.12); font-size:14px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-label="Accueil Honolys">
      <p class="eyebrow">Site officiel</p>
      <h1>Honolys</h1>
      <p>Le site est en cours de finalisation. Une version complète sera mise en ligne prochainement.</p>
      <div class="footer">© 2026 Honolys — honolys.fr</div>
    </section>
  </main>
</body>
</html>
